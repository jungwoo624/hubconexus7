<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퍼스널 브랜드 컨설팅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080810;
      --surface: #10101c;
      --surface-2: #18182a;
      --border: rgba(201,168,76,0.15);
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --gold-dim: rgba(201,168,76,0.4);
      --text: #e8e4dc;
      --text-muted: #7a7488;
      --text-soft: #b0acbc;
      --radius: 16px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background ambient */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(120,80,200,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(201,168,76,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container { max-width: 780px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* Header */
    header {
      padding: 72px 0 56px;
      text-align: center;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .eyebrow::before, .eyebrow::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      font-weight: 300;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 20px;
    }

    h1 em {
      font-style: italic;
      color: var(--gold-light);
    }

    .subtitle {
      font-size: 15px;
      font-weight: 300;
      color: var(--text-soft);
      line-height: 1.7;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Form card */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px;
      margin-bottom: 32px;
    }

    .form-grid {
      display: grid;
      gap: 28px;
    }

    .field { display: flex; flex-direction: column; gap: 10px; }

    label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }

    input, select {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 300;
      padding: 14px 18px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
      appearance: none;
    }

    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }

    input:focus, select:focus {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }

    input::placeholder { color: var(--text-muted); }

    .select-wrap { position: relative; }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      pointer-events: none;
      font-size: 12px;
    }

    select { cursor: pointer; }
    select option { background: #1e1e30; }

    .cta {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border: none;
      border-radius: var(--radius-sm);
      color: #0a0808;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.15em;
      padding: 16px 32px;
      text-transform: uppercase;
      transition: opacity 0.2s, transform 0.2s;
      width: 100%;
      margin-top: 8px;
    }

    .cta:hover { opacity: 0.9; transform: translateY(-1px); }
    .cta:active { transform: translateY(0); }

    /* Results */
    #results {
      display: none;
      animation: fadeUp 0.6s ease forwards;
    }

    #results.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      text-align: center;
      padding: 48px 0 40px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 300;
      color: var(--text);
      margin-bottom: 8px;
    }

    .brand-tagline {
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 0.1em;
      font-style: italic;
    }

    /* Sections */
    .section { margin-bottom: 32px; }

    .section-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Score bar */
    .archetype-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    .archetype-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      color: var(--gold-light);
      margin-bottom: 6px;
    }

    .archetype-sub {
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .trait-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .trait {
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 20px;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.05em;
      padding: 5px 14px;
    }

    /* Color palette */
    .palette-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .swatch-item { text-align: center; }

    .swatch {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .swatch-name { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }

    /* Two-col grid */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .info-card-title {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .info-card p {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.7;
      font-weight: 300;
    }

    /* Style direction */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .style-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 20px 16px;
      text-align: center;
    }

    .style-icon { font-size: 24px; margin-bottom: 10px; }

    .style-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .style-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

    /* Brand slogan */
    .slogan-card {
      background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, rgba(120,80,200,0.05) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
    }

    .slogan-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 300;
      font-style: italic;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .slogan-note { font-size: 13px; color: var(--text-muted); }

    /* Strength bars */
    .strength-row {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .strength-item { }

    .strength-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .strength-label { font-size: 13px; color: var(--text-soft); }
    .strength-val { font-size: 12px; color: var(--gold); }

    .bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0;
    }

    /* Reset */
    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      padding: 12px 28px;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
      width: 100%;
      margin-top: 16px;
      margin-bottom: 80px;
    }

    .reset-btn:hover { border-color: var(--gold-dim); color: var(--text); }

    @media (max-width: 600px) {
      .form-card { padding: 28px 20px; }
      .two-col { grid-template-columns: 1fr; }
      .style-grid { grid-template-columns: 1fr 1fr; }
      .archetype-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <p class="eyebrow">Personal Brand Consulting</p>
    <h1>당신만의 <em>브랜드</em>를<br>발견하세요</h1>
    <p class="subtitle">생년월일, MBTI, 얼굴형을 분석해<br>당신에게 딱 맞는 퍼스널 브랜드 전략을 제안합니다.</p>
  </header>

  <!-- Form -->
  <div class="form-card" id="formSection">
    <div class="form-grid">
      <div class="field">
        <label for="dob">생년월일</label>
        <input type="date" id="dob" max="2010-12-31" min="1940-01-01">
      </div>

      <div class="field">
        <label for="mbti">MBTI 유형</label>
        <div class="select-wrap">
          <select id="mbti">
            <option value="">선택해주세요</option>
            <optgroup label="분석가 (Analysts)">
              <option value="INTJ">INTJ — 전략가</option>
              <option value="INTP">INTP — 논리술사</option>
              <option value="ENTJ">ENTJ — 통솔자</option>
              <option value="ENTP">ENTP — 변론가</option>
            </optgroup>
            <optgroup label="외교관 (Diplomats)">
              <option value="INFJ">INFJ — 옹호자</option>
              <option value="INFP">INFP — 중재자</option>
              <option value="ENFJ">ENFJ — 선도자</option>
              <option value="ENFP">ENFP — 활동가</option>
            </optgroup>
            <optgroup label="관리자 (Sentinels)">
              <option value="ISTJ">ISTJ — 현실주의자</option>
              <option value="ISFJ">ISFJ — 수호자</option>
              <option value="ESTJ">ESTJ — 경영자</option>
              <option value="ESFJ">ESFJ — 집정관</option>
            </optgroup>
            <optgroup label="탐험가 (Explorers)">
              <option value="ISTP">ISTP — 장인</option>
              <option value="ISFP">ISFP — 모험가</option>
              <option value="ESTP">ESTP — 사업가</option>
              <option value="ESFP">ESFP — 연예인</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="face">얼굴형</label>
        <div class="select-wrap">
          <select id="face">
            <option value="">선택해주세요</option>
            <option value="oval">타원형 — 이마와 턱이 균형잡힌 형태</option>
            <option value="round">둥근형 — 볼이 도톰하고 부드러운 형태</option>
            <option value="square">각진형 — 턱선이 강하고 이마가 넓은 형태</option>
            <option value="heart">하트형 — 이마가 넓고 턱이 좁은 형태</option>
            <option value="long">긴형 — 얼굴 길이가 너비보다 긴 형태</option>
            <option value="diamond">다이아몬드형 — 광대뼈가 가장 넓은 형태</option>
          </select>
        </div>
      </div>

      <button class="cta" onclick="analyze()">브랜드 분석 시작하기</button>
    </div>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="result-header">
      <div class="brand-name" id="res-name">—</div>
      <div class="brand-tagline" id="res-tagline">—</div>
    </div>

    <div class="section">
      <div class="section-title">브랜드 아키타입</div>
      <div class="archetype-card">
        <div class="archetype-name" id="res-archetype">—</div>
        <div class="archetype-sub" id="res-archdesc">—</div>
        <div class="trait-list" id="res-traits"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">퍼스널 컬러 팔레트</div>
      <div class="palette-row" id="res-palette"></div>
    </div>

    <div class="section">
      <div class="section-title">스타일 방향</div>
      <div class="style-grid" id="res-style"></div>
    </div>

    <div class="section">
      <div class="section-title">핵심 역량 지수</div>
      <div class="info-card strength-row" id="res-strengths"></div>
    </div>

    <div class="section">
      <div class="two-col">
        <div class="info-card">
          <div class="info-card-title">커뮤니케이션 스타일</div>
          <p id="res-comm">—</p>
        </div>
        <div class="info-card">
          <div class="info-card-title">추천 커리어 방향</div>
          <p id="res-career">—</p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="two-col">
        <div class="info-card">
          <div class="info-card-title">얼굴형 스타일링 팁</div>
          <p id="res-face">—</p>
        </div>
        <div class="info-card">
          <div class="info-card-title">별자리 에너지</div>
          <p id="res-zodiac">—</p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">퍼스널 브랜드 슬로건</div>
      <div class="slogan-card">
        <div class="slogan-text" id="res-slogan">—</div>
        <div class="slogan-note" id="res-slogan-note">—</div>
      </div>
    </div>

    <button class="reset-btn" onclick="reset()">다시 분석하기</button>
  </div>
</div>

<script>

    traits: ['결단력', '리더십', '전략적 실행', '카리스마', '목표 지향성'],

function getZodiac(month, day) {
  const md = month * 100 + day;
  if (md >= 1222 || md <= 119) return ZODIAC[0];
  if (md <= 218) return ZODIAC[1];
  if (md <= 320) return ZODIAC[2];
  if (md <= 419) return ZODIAC[3];
  if (md <= 520) return ZODIAC[4];
  if (md <= 621) return ZODIAC[5];
  if (md <= 722) return ZODIAC[6];
  if (md <= 822) return ZODIAC[7];
  if (md <= 922) return ZODIAC[8];
  if (md <= 1023) return ZODIAC[9];
  if (md <= 1121) return ZODIAC[10];
  return ZODIAC[11];
}

function getLifePathNumber(dateStr) {
  const digits = dateStr.replace(/-/g,'').split('').map(Number);
  let sum = digits.reduce((a,b)=>a+b,0);
  while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
    sum = String(sum).split('').map(Number).reduce((a,b)=>a+b,0);
  }
  return sum;
}

function getAge(dateStr) {
  const today = new Date();
  const birth = new Date(dateStr);
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  return age;
}

function analyze() {
  const dob = document.getElementById('dob').value;
  const mbti = document.getElementById('mbti').value;
  const face = document.getElementById('face').value;

  if (!dob || !mbti || !face) {
    alert('세 가지 항목을 모두 입력해주세요.');
    return;
  }

  const d = new Date(dob);
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const zodiac = getZodiac(month, day);
  const lifeNum = getLifePathNumber(dob);
  const age = getAge(dob);
  const md = mbtiData = MBTI_DATA[mbti];
  const fd = FACE_DATA[face];

  // Name / tagline
  document.getElementById('res-name').textContent = `${mbti} · ${zodiac.name} · ${fd.keywords[0]}`;
  document.getElementById('res-tagline').textContent = `${age}세 | 생명수 ${lifeNum} | ${zodiac.emoji} ${zodiac.name}`;

  // Archetype
  document.getElementById('res-archetype').textContent = md.archetype;
  document.getElementById('res-archdesc').textContent = md.archdesc;
  const traitsEl = document.getElementById('res-traits');
  traitsEl.innerHTML = [...md.traits, ...fd.keywords].map(t=>`<span class="trait">${t}</span>`).join('');

  // Palette
  const palEl = document.getElementById('res-palette');
  palEl.innerHTML = md.palette.map(([color,name])=>`
    <div class="swatch-item">
      <div class="swatch" style="background:${color}"></div>
      <div class="swatch-name">${name}</div>
    </div>`).join('');

  // Style
  const styleEl = document.getElementById('res-style');
  styleEl.innerHTML = md.style.map(([icon,label,desc])=>`
    <div class="style-block">
      <div class="style-icon">${icon}</div>
      <div class="style-label">${label}</div>
      <div class="style-desc">${desc}</div>
    </div>`).join('');

  // Strengths
  const strEl = document.getElementById('res-strengths');
  strEl.innerHTML = md.strengths.map(([label, val])=>`
    <div class="strength-item">
      <div class="strength-meta">
        <span class="strength-label">${label}</span>
        <span class="strength-val">${val}</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" data-width="${val}"></div></div>
    </div>`).join('');

  // Comm / Career
  document.getElementById('res-comm').textContent = md.comm;
  document.getElementById('res-career').textContent = md.career;

  // Face
  document.getElementById('res-face').textContent = fd.tip;

  // Zodiac
  document.getElementById('res-zodiac').textContent = `${zodiac.emoji} ${zodiac.name} (${zodiac.dates})\n\n${zodiac.energy}`;
  document.getElementById('res-zodiac').style.whiteSpace = 'pre-wrap';

  // Slogan
  document.getElementById('res-slogan').textContent = md.slogan;
  document.getElementById('res-slogan-note').textContent = md.sloganNote;

  // Show results
  const results = document.getElementById('results');
  results.classList.add('visible');
  document.getElementById('formSection').style.display = 'none';

  setTimeout(()=>{
    results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('.bar-fill').forEach(bar=>{
      bar.style.width = bar.dataset.width + '%';
    });
  }, 100);
}

function reset() {
  document.getElementById('results').classList.remove('visible');
  document.getElementById('formSection').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
